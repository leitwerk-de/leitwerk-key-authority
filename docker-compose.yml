services:
  lka-app:
    build: .
    container_name: lka-app
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - lka-db
    volumes:
      - ./config:/var/www/lka/config
      - ./sites:/etc/apache2/sites-available

  lka-db:
    image: mysql:8.0
    container_name: lka-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
volumes:
  mysql_data: